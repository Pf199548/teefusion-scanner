<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><title>TeeFusion Mobile Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1423;color:#fff;font:15px system-ui,Arial}
main{max-width:430px;margin:auto;text-align:center;padding:18px 15px 35px}h1{font-size:29px;color:#ffcf40;margin:3px 0}p{margin:8px 0}
.sub{color:#aabbd0;font-size:13px}.tag{display:inline-block;margin:13px 0;padding:8px 15px;border-radius:30px;background:#344256;font-size:12px}
.tag.paired{background:#145638}.cam{width:min(86vw,350px);height:min(86vw,350px);margin:10px auto 15px;border:3px solid #ffd447;border-radius:20px;overflow:hidden;background:#000;position:relative}
#reader{width:100%;height:100%;overflow:hidden;position:relative}
#reader video{width:100%!important;height:100%!important;object-fit:cover!important;display:block!important}
#reader__dashboard,#reader__scan_region img{display:none!important}
.aim{pointer-events:none;position:absolute;inset:22%;border:2px solid rgba(255,210,60,.85);border-radius:14px;z-index:3}
#result{background:#1a2d45;border-radius:14px;min-height:78px;padding:18px 10px;font-size:25px;font-weight:800;overflow-wrap:anywhere}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
button{border:0;border-radius:11px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:#ffd044;color:#091626}
button.alt{background:#374d68;color:#fff}button:disabled{opacity:.5}
.options{padding:6px 0 12px;color:#bfcbda;font-size:13px}.options label{margin:0 8px}
#status{font-size:13px;background:#16283d;border-radius:10px;padding:13px;min-height:44px;overflow-wrap:anywhere}
.manual{margin-top:14px}.manual input{width:100%;padding:13px 15px;background:#1c3048;border:1px solid #4c6480;border-radius:10px;color:#fff;font-size:16px}
.manual button{width:100%;margin-top:9px}small{display:block;color:#9baec6;margin:12px auto;font-size:11px}
#submitFrame{display:none;width:0;height:0;border:0}
</style></head><body><main>
<h1>TeeFusion</h1><p class="sub">Fast Barcode + QR Scanner</p>
<div class="tag" id="connection">Checking pairing…</div>
<div class="cam"><div id="reader"></div><div class="aim"></div></div>
<div id="result">READY TO SCAN</div>
<div class="controls"><button id="start" onclick="startCamera()">Start Camera</button><button class="alt" onclick="stopCamera()">Stop</button></div>
<div class="options"><label><input type="checkbox" id="beep" checked> Beep</label><label><input type="checkbox" id="vibrate" checked> Vibrate</label></div>
<div id="status">Scan the pairing QR on your PC to connect.</div><div id="receipt" style="font-size:13px;margin-top:8px;color:#aabbd0"></div>
<div class="manual"><input id="manualInput" placeholder="Manual test code" maxlength="500"><button class="alt" onclick="manualTest()">Send manual test</button></div>
<small>The camera preview is cropped to a square; recognition analyzes the available camera frame. The GAS receiver confirms each saved scan.</small>

</main><script>
'use strict';
const args=new URLSearchParams(location.search);
const bridge=args.get('bridge')||'';
const pair=args.get('pair')||'';
const validBridge=/^https:\/\/script\.google\.com\/macros\/s\/[-_\w]+\/exec$/i.test(bridge);
const paired=validBridge && /^[a-f0-9]{64}$/i.test(pair);
const $=id=>document.getElementById(id);
$('connection').textContent=paired?'Paired with PC':'TEST MODE — scan PC pairing QR';
if(paired){$('connection').classList.add('paired');$('submitForm').action=bridge;$('pairField').value=pair;}
let scanner=null,starting=false,audio=null,lastCode='',lastAt=0;
const queue=[]; let sending=false;
// JSONP runs a script returned by GAS. Unlike no-cors fetch and iframe POST,
// the callback gives a readable SAVED / PAIR_EXPIRED / SERVER_ERROR result.
function gasCall(action, fields, timeoutMs=16000) {
  return new Promise(resolve => {
    const callbackName='tfCallback_'+newId().replace(/-/g,'_');
    const script=document.createElement('script');
    let done=false;
    const timeout=setTimeout(()=>finish({state:'NO_RESPONSE'}),timeoutMs);
    function finish(response){
      if(done)return;
      done=true;clearTimeout(timeout);script.remove();
      delete window[callbackName];resolve(response);
    }
    window[callbackName]=finish;
    const p=new URLSearchParams({...fields,action,callback:callbackName,nonce:String(Date.now())});
    script.src=bridge+'?'+p.toString();
    script.onerror=()=>finish({state:'NETWORK_ERROR'});
    document.head.appendChild(script);
  });
}
async function checkConnection(){
  if(!paired){status('Not paired. Scan a fresh QR from the PC dashboard.');return;}
  status('Checking connection to GAS…');
  const response=await gasCall('scanner_ping',{});
  status(response.state==='RECEIVER_OK'?'✓ GAS receiver reachable. Ready to scan.':
    'GAS connection failed: '+response.state+'. Check deployment and /exec URL.');
}
function status(text){$('status').textContent=text;}
function newId(){
  if(crypto.randomUUID)return crypto.randomUUID();
  const b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
function unlockAudio(){
  try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    if(!audio)audio=new A();if(audio.state==='suspended')audio.resume().catch(()=>{});
  }catch(e){}
}
function feedback(){
  if($('beep').checked && audio && audio.state==='running')try{
    const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
    o.frequency.value=1050;o.type='sine';g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.12,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.13);
    o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.14);
  }catch(e){}
  if($('vibrate').checked && navigator.vibrate)try{navigator.vibrate(100);}catch(e){}
}
function acceptScan(value,kind){
  value=String(value||'').trim();if(!value)return;
  const now=Date.now();if(value===lastCode && now-lastAt<5000)return;
  if(value.length>500){status('This QR text exceeds the 500 character test limit.');return;}
  lastCode=value;lastAt=now;$('result').textContent=value;feedback();
  if(!paired){status('NOT PAIRED — open using a fresh PC QR link. Nothing was sent.');return;}
  queue.push({value,kind,id:newId()});$('receipt').textContent='Waiting for GAS confirmation…';status('Scan captured. Sending to GAS…');sendQueued();
}
async function sendQueued(){
  if(sending || !queue.length)return;
  sending=true;
  try {
    while(queue.length){
      const item=queue.shift();
      status('Sending '+item.value+' to GAS…');
      const response=await gasCall('scan_submit',{
        pair, eventId:item.id, barcode:item.value,kind:item.kind
      });
      const state=response.state||'UNKNOWN';
      if(state==='SAVED') {
        $('receipt').textContent='✓ SAVED to Google Sheet: '+item.value;
        status('GAS confirmed row '+(response.row||'(existing event)')+'.');
      } else if(state==='PAIR_UNKNOWN'||state==='PAIR_EXPIRED') {
        $('receipt').textContent='Pairing invalid or expired. Generate a fresh PC QR.';
        status(state);queue.length=0;break;
      } else {
        $('receipt').textContent='NOT SAVED: '+state;
        status(response.detail||'Check GAS executions and deployment.');
      }
    }
  } finally {sending=false;}
}
async function startCamera(){
  if(scanner||starting)return;starting=true;$('start').disabled=true;unlockAudio();
  if(typeof Html5Qrcode==='undefined'){status('Scanner library did not load. Check internet.');starting=false;$('start').disabled=false;return;}
  try{
    const f=Html5QrcodeSupportedFormats;
    scanner=new Html5Qrcode('reader',{formatsToSupport:[f.QR_CODE,f.EAN_13,f.EAN_8,f.UPC_A,f.UPC_E,f.CODE_128,f.CODE_39,f.CODE_93,f.ITF,f.CODABAR,f.DATA_MATRIX,f.PDF_417],verbose:false,useBarCodeDetectorIfSupported:true});
    await scanner.start({facingMode:'environment'},{fps:12,disableFlip:true},(value,decode)=>{
      let kind='BARCODE';try{const fmt=String(decode.result.format.formatName||'');if(fmt==='QR_CODE')kind='QR';}catch(e){}
      acceptScan(value,kind);
    },()=>{});
    status(paired?'Scanning. Aim at a code; scans are sent to GAS.':'Scanning in TEST MODE. Scan PC pairing QR to connect.');
  }catch(e){status('Camera start failed: '+(e.message||e));try{if(scanner)await scanner.clear();}catch(_){}scanner=null;}
  finally{starting=false;$('start').disabled=false;}
}
async function stopCamera(){if(!scanner)return;try{await scanner.stop();await scanner.clear();status('Camera stopped.');}catch(e){status('Stop error: '+e.message);}finally{scanner=null;}}
function manualTest(){unlockAudio();const x=$('manualInput').value.trim();if(x){acceptScan(x,'MANUAL');$('manualInput').value='';}}
status(paired?'Paired. Run a manual test or start camera.':'Open this page via the pairing QR generated on your PC.');
if(paired)checkConnection();
</script></body></html>
