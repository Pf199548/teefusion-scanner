
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer">
<title>TeeFusion Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#f5f7fb;background:#091321}*{box-sizing:border-box}body{margin:0}.app{max-width:480px;margin:auto;padding:18px 16px 32px}header{text-align:center;margin:8px 0 18px}.brand{font-size:31px;font-weight:850;color:#f7c537;letter-spacing:-1px}.sub{font-size:13px;color:#9cacc0;margin-top:3px}.pill{display:inline-flex;margin-top:12px;border-radius:40px;background:#344156;padding:8px 16px;font-size:12px}.pill.connected{background:#155e3c}.preview{position:relative;width:min(100%,360px);aspect-ratio:1/1;margin:0 auto 15px;background:#04070a;border:3px solid #f7c537;border-radius:20px;overflow:hidden;isolation:isolate}.preview #reader{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}.preview #reader video{position:absolute!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;width:100%!important;height:100%!important;object-fit:cover!important}.preview #reader__scan_region{width:100%!important;height:100%!important;position:absolute!important;inset:0!important;overflow:hidden!important}.preview #reader__scan_region video{width:100%!important;height:100%!important;object-fit:cover!important}.preview #reader__dashboard,.preview #reader__scan_region img,.preview #reader canvas{display:none!important}.frame{position:absolute;inset:19%;border:2px solid rgba(247,197,55,.72);border-radius:13px;pointer-events:none;z-index:3}.corner{position:absolute;width:23px;height:23px;border-color:#f7c537;border-style:solid}.tl{left:-2px;top:-2px;border-width:4px 0 0 4px;border-radius:9px 0 0 0}.tr{right:-2px;top:-2px;border-width:4px 4px 0 0;border-radius:0 9px 0 0}.bl{left:-2px;bottom:-2px;border-width:0 0 4px 4px;border-radius:0 0 0 9px}.br{right:-2px;bottom:-2px;border-width:0 4px 4px 0;border-radius:0 0 9px 0}.hint{text-align:center;color:#9cacc0;font-size:12px;margin-bottom:13px}.result{background:#16273d;border-radius:16px;padding:20px 12px;text-align:center;min-height:86px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;overflow-wrap:anywhere;word-break:break-word}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:13px 0}.btn{border:0;border-radius:13px;padding:15px 12px;font-weight:750;font-size:15px;color:white;background:#31445d;cursor:pointer}.primary{background:#f7c537;color:#0a1423}.btn:disabled{opacity:.5}.options{display:flex;gap:24px;justify-content:center;margin:16px 0;font-size:14px}.options input{accent-color:#f7c537}.manual{display:flex;gap:8px;margin-top:12px}.manual input{min-width:0;flex:1;border:1px solid #435976;background:#14253a;color:white;padding:13px;border-radius:12px;font-size:16px}.manual .btn{padding:12px 18px}.status{font-size:12px;color:#aebdd0;text-align:center;margin-top:13px;min-height:30px;overflow-wrap:anywhere}.foot{text-align:center;color:#6f829c;font-size:11px;margin-top:14px}
</style></head>
<body><main class="app"><header><div class="brand">TeeFusion</div><div class="sub">Barcode &amp; QR Scanner</div><div class="pill" id="connection">Checking pairing...</div></header>
<div class="preview"><div id="reader"></div><div class="frame"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div></div>
<div class="hint">Align the barcode or QR code in the center</div><div class="result" id="result">READY</div>
<div class="actions"><button class="btn primary" id="startBtn">Start Camera</button><button class="btn" id="stopBtn">Stop</button></div>
<div class="options"><label><input id="sound" type="checkbox" checked> Beep</label><label><input id="vibrate" type="checkbox" checked> Vibrate</label></div>
<div class="manual"><input id="manual" type="text" placeholder="Enter code manually" autocomplete="off"><button class="btn" id="sendBtn">Send</button></div>
<div class="status" id="status">Tap Start Camera to begin</div><div class="foot">TeeFusion • Mobile Scanner</div></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const args=new URLSearchParams(location.search),bridge=args.get('bridge'),pair=args.get('pair');
function validBridge(s){try{const u=new URL(s);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/^\/macros\/s\/[^/]+\/exec$/.test(u.pathname)}catch{return false}}
const paired=validBridge(bridge)&&/^[a-f0-9]{64}$/i.test(pair||'');
$('connection').textContent=paired?'Paired with PC':'Test Mode';$('connection').classList.toggle('connected',paired);
if(paired)history.replaceState(null,'',location.pathname);
let scanner=null,starting=false,audio=null,lastCode='',lastTime=0,queue=Promise.resolve();
function status(t){$('status').textContent=t}
function unlockAudio(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio ||=new A();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch{}}
function feedback(){if($('sound').checked&&audio&&audio.state==='running'){try{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.frequency.value=1050;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.16,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.14)}catch{}}if($('vibrate').checked&&navigator.vibrate)navigator.vibrate(90)}
function scan(code){code=String(code||'').trim();if(!code)return;const now=Date.now();if(code===lastCode&&now-lastTime<2500)return;lastCode=code;lastTime=now;$('result').textContent=code;feedback();if(!paired){status('Scanned (Test Mode)');return}if(code.length>100){status('Code is longer than the GAS test limit (100 characters)');return}
const eventId=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;
queue=queue.catch(()=>{}).then(async()=>{try{await fetch(bridge,{method:'POST',mode:'no-cors',redirect:'follow',body:new URLSearchParams({action:'scanner_push',pair,barcode:code,eventId})});status('Submitted — verify receipt on PC')}catch(e){status('Network error — try again')}})}
async function start(){if(scanner||starting)return;starting=true;$('startBtn').disabled=true;unlockAudio();if(typeof Html5Qrcode==='undefined'){status('Scanner library failed to load. Check internet.');starting=false;$('startBtn').disabled=false;return}try{const formats=['QR_CODE','EAN_13','EAN_8','UPC_A','UPC_E','CODE_128','CODE_39','CODE_93','ITF','CODABAR','DATA_MATRIX','PDF_417'].map(k=>Html5QrcodeSupportedFormats[k]).filter(x=>x!==undefined);scanner=new Html5Qrcode('reader',{formatsToSupport:formats,verbose:false,useBarCodeDetectorIfSupported:true});await scanner.start({facingMode:'environment'},{fps:12,disableFlip:true},scan,()=>{});status('Scanning — aim at a barcode or QR code')}catch(e){status('Camera error: '+(e.message||e));try{if(scanner)await scanner.clear()}catch{}scanner=null}finally{starting=false;$('startBtn').disabled=false}}
async function stop(){if(!scanner)return;try{await scanner.stop();await scanner.clear();status('Camera stopped')}catch(e){status('Stop error: '+e)}finally{scanner=null}}
$('startBtn').addEventListener('click',start);$('stopBtn').addEventListener('click',stop);$('sendBtn').addEventListener('click',()=>{unlockAudio();const v=$('manual').value.trim();if(v){scan(v);$('manual').value=''}});$('manual').addEventListener('keydown',e=>{if(e.key==='Enter')$('sendBtn').click()});
</script></body></html>
